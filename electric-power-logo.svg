<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Electric Power Company</title>
  <desc id="logo-description">Green leaves, a blue lightning bolt and golden sun representing clean electric power.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bd82d"/>
      <stop offset=".52" stop-color="#189b28"/>
      <stop offset="1" stop-color="#075d2b"/>
    </linearGradient>
    <linearGradient id="blue" x1=".15" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#46dcff"/>
      <stop offset=".42" stop-color="#078bd8"/>
      <stop offset="1" stop-color="#06366f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff044"/>
      <stop offset=".55" stop-color="#ffba08"/>
      <stop offset="1" stop-color="#ed7900"/>
    </linearGradient>
  </defs>
  <g transform="translate(4 8)">
    <!-- Green outer leaf/swoosh -->
    <path d="M174 11C94 8 28 57 17 122c-8 45 18 76 63 91-30-20-45-49-39-81C51 77 99 34 174 11Z" fill="url(#green)"/>
    <path d="M42 110c2 42 27 75 69 96 10-28 2-55-23-76-18-15-30-33-34-54-10 10-14 22-12 34Z" fill="url(#green)"/>
    <path d="M102 201c49-8 81-39 95-88-27 9-48 25-61 49-10 18-21 31-34 39Z" fill="url(#green)"/>
    <path d="M53 118c16 26 36 42 57 60M112 198c9-17 17-34 24-53" fill="none" stroke="#e9ffd5" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    <!-- Sun arc and rays -->
    <path d="M91 96C95 55 131 26 181 22c27-2 51 3 71 16-35-9-67-4-91 9-27 15-46 33-70 49Z" fill="url(#gold)"/>
    <path d="M173 27c54-4 101 32 111 82 8 39-9 72-40 94 21-27 30-52 23-81-8-43-42-78-94-95Z" fill="url(#gold)"/>
    <path d="m216 11 14-9 2 19 17 11-20 1-10 16-3-20-17-9 19-9Z" fill="url(#gold)"/>
    <path d="m257 35 17-7-5 18 12 13-19-3-14 13 3-19-13-13 19-2Z" fill="url(#gold)"/>
    <path d="m282 72 19-3-9 17 7 18-17-9-18 7 9-17-7-18 16 8Z" fill="url(#gold)"/>
    <path d="m285 115 18 7-18 7-7 18-6-18-18-7 18-7 6-18 7 18Z" fill="url(#gold)"/>
    <path d="m270 158 15 13-20 1-11 16-2-20-16-11 20-2 10-16 4 19Z" fill="url(#gold)"/>
    <!-- Blue lightning bolt -->
    <path d="m198 30-87 94 53-7-44 82 116-116-59 8 21-61Z" fill="url(#blue)" stroke="#07376d" stroke-width="4" stroke-linejoin="round"/>
    <path d="m198 30-34 86 31-5-75 88 44-82-53 7 87-94Z" fill="#5be4ff" opacity=".45"/>
    <!-- Lower green sweep -->
    <path d="M25 130c9 47 54 74 111 74 50 0 96-20 124-57-17 42-66 67-124 67-67 0-112-32-121-84Z" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="800" fill="#073b79">
    <text x="330" y="91" font-size="62" letter-spacing="-2">Electric</text>
    <text x="330" y="151" font-size="62" letter-spacing="-2">Power</text>
    <text x="336" y="194" font-family="Arial, Helvetica, sans-serif" font-style="normal" font-size="25" font-weight="700" letter-spacing="8" fill="#168a34">COMPANY</text>
  </g>
  <path d="M337 163h330" stroke="#26a739" stroke-width="6" stroke-linecap="round"/>
</svg>
